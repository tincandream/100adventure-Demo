<!-- AUDIO -->

<section
    id="playlist"
    class="tab-content issue-chapter"
>

    <div class="chapter-heading">

        <p class="section-marker">
            Chapter Four
        </p>

        <h2>
            Audio Field Guide
        </h2>

        <p>
            Every journey has two ways of listening.
            Follow the soundtrack of the road,
            or pause and hear the landscape itself.
        </p>

    </div>


    <div class="audio-grid">

        <!-- SOUNDSCAPE -->

        <article class="audio-card">

            <p class="section-marker">
                Soundscape
            </p>

            <h3 id="soundscapeTitle"></h3>

            <p id="soundscapeDescription"></p>

            <audio
                id="soundscapePlayer"
                controls
                preload="metadata"
            >
                Your browser doesn't support audio.
            </audio>

            <div class="audio-meta">

                <span id="soundscapeDuration"></span>

                <span id="soundscapeCredit"></span>

            </div>

        </article>


        <!-- PLAYLIST -->

        <article class="audio-card">

            <p class="section-marker">
                Playlist
            </p>

            <h3 id="playlistTitle"></h3>

            <p id="playlistPlatform"></p>

            <a
                class="button"
                id="playlistLink"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open Playlist
            </a>

        </article>
        
    </div>

    <script src="adventures.js"></script>
    <script src="app.js"></script>

</body>
</html>

    

</section>
